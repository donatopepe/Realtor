name: CodeQL

# Analisi statica di sicurezza (GitHub Code Scanning) su app, service worker,
# server, script e test. I risultati compaiono nella scheda Security del repo.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '23 4 * * 1' # ogni lunedì

permissions:
  contents: read

jobs:
  analyze:
    name: Analisi CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Inizializza CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
          config: |
            paths-ignore:
              - www/js/jquery
              - node_modules
              - platforms
              - plugins
              - docs/screenshots

      - name: Analizza
        uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          category: '/language:javascript-typescript'
