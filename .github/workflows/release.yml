name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  package-web:
    name: Pacchetto web/PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Crea l'archivio di www/
        run: |
          mkdir -p dist
          (cd www && zip -qr "../dist/realtor-web-${GITHUB_REF_NAME}.zip" .)
          ls -lh dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-package
          path: dist/*.zip
          retention-days: 30

  package-android:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Accetta le licenze e installa piattaforma e build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - run: npm ci

      - name: Aggiungi la piattaforma Cordova
        run: npx cordova platform add android

      - name: APK di release firmato (se i segreti sono configurati)
        id: signed
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Nessun keystore configurato: salto la build firmata."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          cat > platforms/android/release-signing.properties <<EOF
          storeFile=$RUNNER_TEMP/release.keystore
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          npx cordova build android --release
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: APK di debug come fallback
        if: steps.signed.outputs.signed != 'true'
        run: npx cordova build android --debug

      - name: Raccogli gli APK
        run: |
          mkdir -p dist
          find platforms/android/app/build/outputs -name '*.apk' -exec cp {} dist/ \;
          ls -lh dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-apk
          path: dist/*.apk
          retention-days: 30

  publish:
    name: GitHub Release
    needs: [package-web, package-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist

      - name: Pubblica la release con gli artefatti
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          files: |
            dist/web-package/*.zip
            dist/android-apk/*.apk
          body: |
            Realtor ${{ github.ref_name }}

            - `realtor-web-*.zip`: build web/PWA (contenuto di `www/`, da servire in HTTPS).
            - `*.apk`: app Android (firmata se i segreti di firma sono configurati, altrimenti debug).

            Dettagli di installazione e pubblicazione in `docs/PUBLISHING.md`.
