name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Lint, segreti, integrità, documentazione, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # la scansione dei segreti controlla anche la storia

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Stile del codice
        run: npm run lint

      - name: Nessun segreto in working tree e storia
        run: npm run scan:secrets:history

      - name: Integrità dei file dell'app (SRI)
        run: npm run sri:check

      - name: Audit dipendenze runtime
        run: npm run audit:prod

      - name: Documentazione coerente
        run: npm run docs:check

      - name: Test unitari e di integrazione
        run: npm test

      - name: SBOM CycloneDX
        run: npm run sbom

      - name: Audit completo dipendenze (runtime + toolchain)
        run: npm run audit:report

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 30

  security:
    name: Audit completo dipendenze e SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Vulnerabilità delle dipendenze di produzione (bloccante)
        run: npm run audit:prod

      - name: Report dipendenze toolchain (informativo)
        continue-on-error: true
        run: npm audit --omit=prod --audit-level=high

  codeql:
    name: CodeQL security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Inizializza CodeQL
        uses: github/codeql-action/init@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
          config: |
            paths-ignore:
              - www/js/jquery
              - node_modules
              - platforms
              - plugins
              - docs/screenshots

      - name: Analizza codice
        uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          category: '/language:javascript-typescript'

  e2e:
    name: End-to-end (desktop + mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Installa Chromium
        run: npx playwright install --with-deps chromium

      - name: Test end-to-end
        run: npm run test:e2e

      - name: Report Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Accetta le licenze e installa piattaforma e build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - run: npm ci

      - name: Aggiungi la piattaforma Cordova
        run: npx cordova platform add android

      - name: Compila l'APK di debug
        run: npx cordova build android --debug

      - name: Verifica l'APK
        run: |
          APK=$(find platforms/android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -n "$APK"
          ls -lh "$APK"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: realtor-apk-debug
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  ios:
    name: Build iOS (simulatore)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Prepara la piattaforma iOS (workaround ESM, vedi docs/PUBLISHING.md)
        run: npm run prepare:ios

      - name: Compila per il simulatore (senza firma)
        run: npx cordova build ios --emulator --debug

  docker:
    name: Immagine Docker del server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build dell'immagine
        run: docker build -f server/Dockerfile -t realtor-api:ci .

      - name: Avvio e health check
        run: |
          docker run -d --name realtor-api-ci -p 3000:3000 realtor-api:ci
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/health; then break; fi
            sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:3000/realtor/api/scheda \
            -H 'Content-Type: application/json' \
            -d '{"nome":"Scheda CI","prezzo":"1.000,50"}'
          docker rm -f realtor-api-ci
