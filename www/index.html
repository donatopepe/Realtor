<html>
    <head>

        <meta charset="utf-8" />
        <meta name="format-detection" content="telephone=no" />
        <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, height=device-height, viewport-fit=cover" />
        <title>Realtor</title>

        <!-- Web / PWA (Android, iOS, desktop): installabile e utilizzabile senza Cordova -->
        <meta name="description" content="Applicazione di statistica e stime immobiliari: gestione offline-first di schede immobiliari." />
        <meta name="theme-color" content="#1d1d1d" />
        <meta name="color-scheme" content="light" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="Realtor" />
        <link rel="manifest" href="manifest.webmanifest" />
        <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon-180.png" />

   		<link rel="stylesheet" type="text/css" href="js/jquery/jquery.mobile-1.4.2.min.css" />
        <link rel="stylesheet" type="text/css" href="css/index.css" />
        
        <!-- Carico prima le librerie   -->
        <script type="text/javascript" src="cordova.js"></script>
        
        <script type="text/javascript" src="js/jquery/jquery-2.1.0.min.js"></script>

        <script type="text/javascript">
            // Opzioni di jQuery Mobile: devono essere impostate prima della libreria.
            $(document).on("mobileinit", function () {
                $.mobile.allowCrossDomainPages = true;
            });
        </script>

        <script type="text/javascript" src="js/jquery/jquery.mobile-1.4.2.min.js"></script>

        <!-- App: core + UI, modulo ES (boot automatico) -->
        <script type="module" src="js/app.js"></script>
        
		
    </head>
    <body>
    
            <div data-role="page" id="homePage">
    			<div data-theme="a" data-role="header">
      			  <h3>Schede immobiliari</h3>
      			  <a id="btnExit" data-role="button" href="#homePage" data-icon="power" data-iconpos="right" class="ui-btn-right"></a>
    			</div>
 
  				<div data-role="content">
        			<a data-role="button" href="#scheda" data-icon="plus" data-iconpos="left">Nuova scheda</a>
        			<a data-role="button" href="#elencoSchede" data-icon="bars" data-iconpos="left">Elenco schede</a>
        			<a id="btnInviaSchede" data-role="button" href="#page1" data-icon="forward" data-iconpos="left">Invia schede</a>
		  		  </div>
 
  				<div data-theme="a" data-role="footer" data-position="fixed">
        			<h3>Schede immobiliari</h3>
        		</div>
			</div>
			
 		   <div data-role="page" id="scheda">
  			  <div data-theme="" data-role="header">
  		  		 <a id="btnBack" data-role="button" href="#homePage" data-icon="back" data-iconpos="left" class="ui-btn-left"></a>
   			     <h3>Nuova scheda</h3>
 			  </div>
 		
 		 	  <div data-role="content">
       			 <div data-role="fieldcontain">
      		      <input name="txtNome" id="txtNome" placeholder="Nome scheda" value="" type="text">
    		  </div>
        	  <div data-role="fieldcontain">
            		<input name="txtIndirizzo" id="txtIndirizzo" placeholder="Indirizzo" value="" type="text">
              </div>
       		  <div data-role="fieldcontain">
            		<textarea name="txtDescrizione" id="txtDescrizione" placeholder="Descrizione"></textarea>
        	  </div>
        	  <div data-role="fieldcontain">
            		<input name="txtPrezzo" id="txtPrezzo" placeholder="Prezzo (es. 150.000,50)" value="" type="text" inputmode="decimal">
        	  </div>
        	  <div data-role="fieldcontain">
            		<a id="btnSalva" data-role="button" href="#">Salva</a>
              </div>
    		</div>
     
    		<div data-theme="a" data-role="footer" data-position="fixed">
        		<h3>Schede immobiliari</h3>
    		</div>
		</div>

		<div data-role="page" id="elencoSchede">
		    <div data-theme="" data-role="header">
        		<a id="btnBack" data-role="button" href="#homePage" data-icon="back" data-iconpos="left" class="ui-btn-left"></a>
      			<h3>Schede immobiliari</h3>
    		</div>
 
	    	<div data-role="content">
    	    <ul id="liElencoSchede" data-role="listview" data-divider-theme="d" data-inset="true">
        	</ul>
    		</div>
     
   			 <div data-theme="a" data-role="footer" data-position="fixed">
        			<h3>Schede immobiliari</h3>
   			 </div>
		</div>

    </body>
    
    
    
</html>
